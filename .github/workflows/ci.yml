name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  CI: 'true'

jobs:
  quality:
    name: Static checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install root tooling
        run: npm ci
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Generate Prisma client
        run: npm --prefix backend run prisma:generate
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install agent dependencies
        run: npm --prefix agent ci
      - name: Run project checks
        run: npm run check

  e2e-smoke:
    name: Admin E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
      - name: Generate Prisma client and build backend
        run: |
          npm --prefix backend run prisma:generate
          npm --prefix backend run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start test environment
        run: ./start.sh --env test --daemon
      - name: Wait for services
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4100/api/v1/health/ready >/dev/null \
              && curl -fsS http://localhost:5100/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'services did not become ready in time' >&2
          exit 1
      - name: Run admin smoke
        run: npm run test:e2e:smoke
      # 布局与响应式门禁（T-029）：1366/900/899/390 四档 × 8 路由，
      # 断言无横向滚动、`.app-content` 内边距阶梯、每页唯一 h1 与页头字号分级。
      # 阻塞式，不加 continue-on-error。用默认 playwright.config.ts 的 chromium
      # 单项目（另两个浏览器未在 CI 安装，且会三倍增加时长）。
      - name: Run layout responsive
        working-directory: frontend
        timeout-minutes: 15
        run: npx playwright test --config playwright.config.ts --project=chromium tests/layout-responsive.spec.ts
      # 上传运行时回归（T-052）：拖拽/粘贴/非法文件拦截/390 无溢出。
      # 断言按 toast 的 data-testid + role 判状态类型，不锁用户文案（T-051）。
      # 阻塞式；2 条素材库与手机回传路径在文件内显式 skip。
      - name: Run upload runtime
        working-directory: frontend
        timeout-minutes: 10
        run: npx playwright test --config playwright.config.ts --project=chromium tests/upload-runtime.spec.ts
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop services
        if: always()
        run: ./start.sh --stop || true

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_ENV_FILE: ./backend/.env.production.example
      NPM_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: npm run verify:compose
      - uses: docker/setup-buildx-action@v3
      - name: Build production images
        run: docker compose -f docker-compose.production.yml build migrate backend frontend
