<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Codex Web：在浏览器里使用 Codex SDK 的本地工作台。"
    />
    <meta name="theme-color" content="#0b0d10" />
    <title>Codex Web</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="会话列表">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 2.8 20 7.4v9.2L12 21.2 4 16.6V7.4L12 2.8Z" stroke="currentColor" stroke-width="1.5" />
              <path d="m8.2 14.8 3-3.2-3-3.2M13.2 15.2h3.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="brand-copy">
            <strong>Codex Web</strong>
            <span>local agent workspace</span>
          </div>
          <button class="icon-button close-sidebar" id="closeSidebarButton" type="button" aria-label="关闭侧栏">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>

        <button class="new-chat-button" id="newChatButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span>新会话</span>
          <kbd>⌘ N</kbd>
        </button>

        <div class="section-label">
          <span>最近会话</span>
          <span class="section-count" id="sessionCount">0</span>
        </div>
        <nav class="session-list" id="sessionList"></nav>

        <div class="sidebar-footer">
          <button class="sidebar-action" id="resumeButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5" /></svg>
            <span>恢复线程</span>
          </button>
          <button class="sidebar-action" id="settingsButton" type="button" data-open-settings aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" /><path d="m19 13.5 1.4 1.1-1.8 3.1-1.7-.7a7 7 0 0 1-2.6 1.5l-.3 1.8h-3.6l-.3-1.8A7 7 0 0 1 7.5 17l-1.7.7-1.8-3.1 1.4-1.1a7 7 0 0 1 0-3L4 9.4l1.8-3.1 1.7.7A7 7 0 0 1 10.1 5.5L10.4 4h3.6l.3 1.8A7 7 0 0 1 17 7l1.7-.7 1.8 3.1-1.4 1.1a7 7 0 0 1 0 3Z" /></svg>
            <span>设置</span>
          </button>
          <button class="sidebar-action" id="themeButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z" /></svg>
            <span id="themeLabel">切换浅色</span>
          </button>
          <div class="server-pill" id="serverPill">
            <span class="pulse-dot" id="serverDot"></span>
            <span id="serverState">连接中…</span>
          </div>
        </div>
      </aside>

      <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="关闭侧栏"></button>

      <main class="main-panel">
        <header class="topbar">
          <button class="icon-button menu-button" id="menuButton" type="button" aria-label="打开会话列表">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <div class="title-block">
            <h1 id="sessionTitle">新会话</h1>
            <div class="session-meta" id="sessionMeta"><span>本地 Codex 工作台</span></div>
          </div>
          <div class="topbar-actions">
            <button class="ghost-button thread-button" id="copyThreadButton" type="button" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h10v10H9z" /><path d="M5 15V5h10" /></svg>
              <span>线程 ID</span>
            </button>
            <button
              class="icon-button"
              id="topSettingsButton"
              type="button"
              aria-label="会话设置"
              aria-haspopup="dialog"
              title="会话设置"
              data-open-settings
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
                <circle cx="15" cy="7" r="2" />
                <circle cx="9" cy="17" r="2" />
              </svg>
            </button>
            <button class="icon-button" id="topNewChatButton" type="button" aria-label="新会话" title="新会话">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
          </div>
        </header>

        <section class="messages" id="messages" aria-live="polite" aria-label="对话">
          <div class="empty-state" id="emptyState">
            <div class="empty-intro">
              <div class="empty-orbit" aria-hidden="true">
                <span></span><span></span><span></span>
                <div class="empty-core">
                  <svg viewBox="0 0 24 24"><path d="M12 2.8 20 7.4v9.2L12 21.2 4 16.6V7.4L12 2.8Z" /><path d="m8.2 14.8 3-3.2-3-3.2M13.2 15.2h3.1" /></svg>
                </div>
              </div>
              <div class="empty-copy">
                <span class="empty-kicker"><span class="empty-kicker-dot"></span>Local agent workspace</span>
                <h2>让 <span class="empty-accent">Codex</span> 开始工作</h2>
                <p>读取代码、运行命令、修改文件。每个会话都受工作目录与沙箱策略约束。</p>
                <div class="empty-context" aria-label="当前会话设置">
                  <button class="context-chip" type="button" data-open-settings aria-haspopup="dialog" title="打开会话设置">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h6l2 2h9v10h-17z" /></svg>
                    <span id="emptyWorkspaceLabel">.</span>
                  </button>
                  <button class="context-chip" type="button" data-open-settings aria-haspopup="dialog" title="打开会话设置">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 19 6v5.2c0 4.3-2.8 7.6-7 9.6-4.2-2-7-5.3-7-9.6V6l7-2.8Z" /><path d="m9 12 2 2 4-4" /></svg>
                    <span id="emptySandboxLabel">工作区写入</span>
                  </button>
                  <button class="context-chip" type="button" data-open-settings aria-haspopup="dialog" title="打开会话设置">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" /><path d="M9.5 2.8v3.2M14.5 2.8v3.2M9.5 18v3.2M14.5 18v3.2M2.8 9.5h3.2M2.8 14.5h3.2M18 9.5h3.2M18 14.5h3.2" /></svg>
                    <span id="emptyModelLabel">Codex 默认模型</span>
                  </button>
                </div>
              </div>
            </div>
            <div class="suggestion-block">
              <div class="suggestion-head">
                <span>快速开始</span>
                <span class="suggestion-hint">选择一个示例任务</span>
              </div>
              <div class="suggestion-grid">
                <button class="suggestion" type="button" data-prompt="先快速浏览这个仓库，说明整体架构、启动方式和关键模块。">
                  <span class="suggestion-icon">◇</span>
                  <span class="suggestion-copy"><strong>读懂仓库</strong><small>架构、启动方式与关键模块</small></span>
                  <span class="suggestion-arrow" aria-hidden="true">→</span>
                </button>
                <button class="suggestion" type="button" data-prompt="检查当前仓库里最可能出问题的部分，列出 3 个具体风险，并说明证据。">
                  <span class="suggestion-icon">△</span>
                  <span class="suggestion-copy"><strong>审视风险</strong><small>找出隐患并给出证据</small></span>
                  <span class="suggestion-arrow" aria-hidden="true">→</span>
                </button>
                <button class="suggestion" type="button" data-prompt="运行相关测试，定位当前失败项并给出最小修复方案。">
                  <span class="suggestion-icon">↻</span>
                  <span class="suggestion-copy"><strong>修复失败</strong><small>跑测试、定位并修复</small></span>
                  <span class="suggestion-arrow" aria-hidden="true">→</span>
                </button>
                <button class="suggestion" type="button" data-prompt="为最近修改过的模块补充一组高价值测试，并实际运行验证。">
                  <span class="suggestion-icon">＋</span>
                  <span class="suggestion-copy"><strong>补充测试</strong><small>覆盖关键路径并验证</small></span>
                  <span class="suggestion-arrow" aria-hidden="true">→</span>
                </button>
              </div>
            </div>
          </div>
          <div class="timeline" id="timeline"></div>
        </section>

        <footer class="composer-region">
          <div class="error-banner" id="errorBanner" role="alert" hidden>
            <div class="error-icon">!</div>
            <div class="error-copy">
              <strong id="errorTitle">请求失败</strong>
              <span id="errorMessage"></span>
            </div>
            <button class="icon-button" id="dismissErrorButton" type="button" aria-label="关闭错误提示">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <form class="composer" id="composerForm">
            <div class="composer-inner">
              <textarea
                id="promptInput"
                rows="1"
                maxlength="100000"
                placeholder="描述要完成的任务，或粘贴报错信息…"
                aria-label="任务内容"
              ></textarea>
              <div class="composer-bottom">
                <div class="composer-context" id="composerContext"></div>
                <div class="composer-actions">
                  <span class="shortcut-hint">Enter 发送 · Shift+Enter 换行</span>
                  <button class="stop-button" id="stopButton" type="button" hidden>
                    <span class="stop-square"></span><span id="stopLabel">停止</span>
                  </button>
                  <button class="send-button" id="sendButton" type="submit" aria-label="发送">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-5 14-2.4-5.4L5 12Z" /><path d="m11.6 13.6 3.2-3.2" /></svg>
                  </button>
                </div>
              </div>
            </div>
          </form>
          <div class="composer-note">Codex 可以读取并修改工作目录中的文件。高风险操作请留在沙箱策略内。</div>
        </footer>
      </main>
    </div>

    <dialog class="modal" id="settingsDialog">
      <div class="modal-card">
        <div class="modal-head">
          <div><span class="eyebrow">Workspace</span><h2>会话设置</h2></div>
          <button class="icon-button" type="button" data-close-dialog="settingsDialog" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="modal-body">
          <label class="field">
            <span class="field-label">工作目录</span>
            <input id="workspaceInput" type="text" spellcheck="false" placeholder="." />
            <span class="field-hint" id="workspaceHint">相对于允许的根目录，也可以填写根目录内的绝对路径。</span>
          </label>
          <label class="field">
            <span class="field-label">模型</span>
            <input id="modelInput" type="text" spellcheck="false" placeholder="跟随 Codex 配置" />
            <span class="field-hint">留空时使用 Codex CLI 配置中的默认模型。</span>
          </label>
          <div class="field-grid">
            <label class="field">
              <span class="field-label">推理强度</span>
              <select id="reasoningSelect">
                <option value="minimal">minimal</option>
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
                <option value="xhigh">xhigh</option>
                <option value="max">max</option>
                <option value="ultra">ultra</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label">沙箱</span>
              <select id="sandboxSelect">
                <option value="workspace-write">workspace-write</option>
                <option value="read-only">read-only</option>
                <option value="danger-full-access" id="dangerOption" hidden>danger-full-access</option>
              </select>
            </label>
          </div>
          <div class="field-grid">
            <label class="field">
              <span class="field-label">网页搜索</span>
              <select id="webSearchSelect">
                <option value="disabled">disabled</option>
                <option value="cached">cached</option>
                <option value="live">live</option>
              </select>
            </label>
            <label class="toggle-field">
              <span><strong>沙箱联网</strong><small>允许命令访问网络</small></span>
              <input id="networkCheckbox" type="checkbox" />
              <span class="toggle-track" aria-hidden="true"></span>
            </label>
          </div>
          <label class="field">
            <span class="field-label">访问令牌 <span class="optional">可选</span></span>
            <input id="tokenInput" type="password" autocomplete="off" placeholder="AGENT_ACCESS_TOKEN" />
            <span class="field-hint">只在当前浏览器标签页保存，用于访问设置了令牌的服务端。</span>
          </label>
          <div class="settings-note">设置会用于新建会话。执行审批固定为 never，权限由沙箱策略控制。</div>
        </div>
        <div class="modal-footer">
          <button class="ghost-button" type="button" data-close-dialog="settingsDialog">取消</button>
          <button class="primary-button" id="saveSettingsButton" type="button">保存设置</button>
        </div>
      </div>
    </dialog>

    <dialog class="modal" id="resumeDialog">
      <div class="modal-card compact">
        <div class="modal-head">
          <div><span class="eyebrow">Thread</span><h2>恢复 Codex 线程</h2></div>
          <button class="icon-button" type="button" data-close-dialog="resumeDialog" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="modal-body">
          <label class="field">
            <span class="field-label">线程 ID</span>
            <input id="resumeThreadInput" type="text" spellcheck="false" placeholder="例如 019a4f…" />
            <span class="field-hint">线程保存在 ~/.codex/sessions。恢复后继续使用当前会话设置。</span>
          </label>
        </div>
        <div class="modal-footer">
          <button class="ghost-button" type="button" data-close-dialog="resumeDialog">取消</button>
          <button class="primary-button" id="confirmResumeButton" type="button">恢复</button>
        </div>
      </div>
    </dialog>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
