<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>货觉AI · 电商视觉创作平台</title>
    <!-- 品牌元信息: 唯一事实源 docs/brand/brand-basics.md (2026-10-19 定名货觉AI) -->
    <meta
      name="description"
      content="货觉AI —— 上传商品图，生成能上架的图。商品主图、详情页、营销视觉，一站生成。"
    />
    <meta name="application-name" content="货觉AI" />
    <meta name="theme-color" content="#5546d8" />
    <link rel="icon" type="image/svg+xml" href="/brand/huojue-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/mark-32.png" />
    <link rel="apple-touch-icon" href="/brand/mark-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 分享卡: og:image 用相对路径, 正式部署时须替换为绝对 URL (社交平台不解析相对路径) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="货觉AI" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="货觉AI · 电商视觉创作平台" />
    <meta property="og:description" content="好图，好卖 —— 商品图 · 详情页 · 营销视觉，一站生成。" />
    <meta property="og:image" content="/brand/og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="货觉AI —— 好图，好卖" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="货觉AI · 电商视觉创作平台" />
    <meta name="twitter:description" content="好图，好卖 —— 商品图 · 详情页 · 营销视觉，一站生成。" />
    <meta name="twitter:image" content="/brand/og-1200x630.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      字体用**可变字体轴**(400..800) 而不是 5 个静态字重:
      静态写法要 540 个 @font-face / 577 KB CSS(gzip 156 KB); 可变轴只要
      108 个 face / 116 KB(gzip 31.5 KB), 字形覆盖与 400-800 全部字重不变 ——
      800 仍可真实渲染 (`pk-primary-btn` 在用), 不会退化成合成伪粗体。
      中文 101 个分片按 unicode-range 懒加载, 只下当前页面用到的部分。

      用 media="print" → onload 切 media 做**非阻塞**加载: 字体 CSS 不再挡住
      首屏渲染。JS 执行前字体栈先落到系统字体, 切换时只看得到一次重排;
      比渲染阻塞 577 KB 的 CSS 明显更快。`display=swap` 已保证文字先用
      系统字体可见。
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Noto+Sans+SC:wght@400..800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Noto+Sans+SC:wght@400..800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
